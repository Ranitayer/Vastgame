name: Build experimental Vastgame Core VM
on:
  workflow_dispatch:
    inputs:
      prepared_image:
        description: 'Optional: flatten an already built Core image by its ghcr.io/ranitayer/vastgame-core@sha256 digest'
        required: false
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: core-vm-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free space on the disposable build runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
          docker image prune -af
          df -h /
          available=$(df --output=avail -B1 / | tail -n1)
          test "$available" -ge 42949672960 || { echo 'At least 40 GiB free is required for the guest image build'; exit 1; }
      - name: Install guest-disk build tools
        timeout-minutes: 15
        if: inputs.prepared_image == ''
        run: |
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libguestfs-tools qemu-utils jq
      - name: Validate unprivileged guest networking
        if: inputs.prepared_image == ''
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_BACKEND_SETTINGS: force_tcg
        run: |
          # Ubuntu restricts reading /boot kernels. Copy one for this build user,
          # rather than running the network helper as root or changing host permissions.
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -n1)
          test -n "$kernel"
          mkdir -p "$RUNNER_TEMP/guestfs-kernel"
          sudo cp "$kernel" "$RUNNER_TEMP/guestfs-kernel/$(basename "$kernel")"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/guestfs-kernel/$(basename "$kernel")"
          export SUPERMIN_KERNEL="$RUNNER_TEMP/guestfs-kernel/$(basename "$kernel")"
          export SUPERMIN_MODULES="/lib/modules/${kernel##*/vmlinuz-}"
          test -d "$SUPERMIN_MODULES"
          printf 'SUPERMIN_KERNEL=%s\nSUPERMIN_MODULES=%s\n' "$SUPERMIN_KERNEL" "$SUPERMIN_MODULES" >> "$GITHUB_ENV"
          timeout 180 guestfish --network -N "$RUNNER_TEMP/guestfs-network-probe.img=disk:16M" ping-daemon
          rm -f "$RUNNER_TEMP/guestfs-network-probe.img"
      - name: Authenticate package access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build the VM disk and wrapper image
        env:
          CORE_IMAGE: ghcr.io/ranitayer/vastgame-core
          PREPARED_IMAGE: ${{ inputs.prepared_image }}
        run: |
          if [[ -n "$PREPARED_IMAGE" ]]; then
            [[ "$PREPARED_IMAGE" =~ ^ghcr.io/ranitayer/vastgame-core@sha256:[0-9a-f]{64}$ ]]
            docker pull "$PREPARED_IMAGE"
            python3 packaging/core-vm/flatten.py "$PREPARED_IMAGE" "$CORE_IMAGE:build-$GITHUB_SHA"
            mkdir -p build
            jq -n --arg source "$PREPARED_IMAGE" --arg commit "$GITHUB_SHA" --arg image "$CORE_IMAGE:build-$GITHUB_SHA" \
              '{prepared_source:$source,source_commit:$commit,image:$image,live_validated:false}' > build/core-vm-receipt.json
          else
            bash packaging/core-vm/build.sh
          fi
      - name: Publish experimental image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/ranitayer/vastgame-core:build-${GITHUB_SHA}"
          digest=$(docker image inspect "ghcr.io/ranitayer/vastgame-core:build-${GITHUB_SHA}" --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          jq --arg digest "$digest" '.image_digest=$digest' build/core-vm-receipt.json > build/core-vm-receipt.tmp
          mv build/core-vm-receipt.tmp build/core-vm-receipt.json
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with:
          name: core-vm-build-receipt
          path: build/core-vm-receipt.json
