name: Build experimental Vastgame Core VM
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: core-vm-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free space on the disposable build runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
          docker image prune -af
          df -h /
          available=$(df --output=avail -B1 / | tail -n1)
          test "$available" -ge 42949672960 || { echo 'At least 40 GiB free is required for the guest image build'; exit 1; }
      - name: Install guest-disk build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils jq
      - name: Build the VM disk and wrapper image
        env:
          CORE_IMAGE: ghcr.io/ranitayer/vastgame-core
        run: sudo --preserve-env=CORE_IMAGE,GITHUB_SHA,RUNNER_TEMP bash packaging/core-vm/build.sh
      - name: Publish experimental image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/ranitayer/vastgame-core:build-${GITHUB_SHA}"
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with:
          name: core-vm-build-receipt
          path: build/core-vm-receipt.json
